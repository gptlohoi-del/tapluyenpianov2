name: Build Piano V2 APK
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'songs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK (without deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm test
      - name: Prepare web content and bundled OTA bridge
        run: npm run build:web
      - name: Generate Android native project and sync plugins
        run: |
          npx cap add android
          npx cap sync android
      - name: Set monotonically increasing native versionCode
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "2.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
              }
          }
          GRADLE
      - name: Build Debug APK for initial test
        working-directory: android
        run: bash gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Debug APK (not for permanent updates)
        uses: actions/upload-artifact@v4
        with:
          name: piano-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Detect signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KS" && -n "$KSP" && -n "$KA" && -n "$KP" ]]; then
            echo "Piano V2 release signing is configured"
            echo "SIGN_RELEASE=yes" >> "$GITHUB_ENV"
          else
            echo "Release signing not configured: Debug APK only. See docs/RELEASE_SIGNING_WINDOWS.md"
            echo "SIGN_RELEASE=no" >> "$GITHUB_ENV"
          fi
      - name: Configure signing without committing secrets
        if: env.SIGN_RELEASE == 'yes'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  pianoRelease {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.pianoRelease
                  }
              }
          }
          GRADLE
      - name: Build signed Release APK
        if: env.SIGN_RELEASE == 'yes'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload signed Release APK
        if: env.SIGN_RELEASE == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: piano-v2-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
