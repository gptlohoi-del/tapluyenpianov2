name: Build PIANO APK

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'songs/**'
      - 'android-assets/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_VERSION: 2.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Prepare web content and bundled OTA bridge
        run: npm run build:web

      - name: Generate Android native project and sync plugins
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's/android:name="\.MainActivity"/android:name=".MainActivity" android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml

      - name: Apply original PIANO app icons
        run: cp -R android-assets/res/. android/app/src/main/res/

      - name: Set native Android version
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName System.getenv("APK_VERSION") ?: "2.0.1"
              }
          }
          GRADLE

      - name: Build Debug APK for testing
        working-directory: android
        run: bash gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename Debug APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/PIANO-${APK_VERSION}-debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PIANO-${{ env.APK_VERSION }}-debug
          path: android/app/build/outputs/apk/debug/PIANO-${{ env.APK_VERSION }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Detect release signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KS" && -n "$KSP" && -n "$KA" && -n "$KP" ]]; then
            echo "Release signing is configured"
            echo "SIGN_RELEASE=yes" >> "$GITHUB_ENV"
          else
            echo "Release signing is not configured; only a Debug APK will be uploaded"
            echo "SIGN_RELEASE=no" >> "$GITHUB_ENV"
          fi

      - name: Configure release signing
        if: env.SIGN_RELEASE == 'yes'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  pianoRelease {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.pianoRelease
                  }
              }
          }
          GRADLE

      - name: Build signed Release APK
        if: env.SIGN_RELEASE == 'yes'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename signed Release APK
        if: env.SIGN_RELEASE == 'yes'
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/PIANO-${APK_VERSION}.apk"

      - name: Upload signed Release APK
        if: env.SIGN_RELEASE == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: PIANO-${{ env.APK_VERSION }}
          path: android/app/build/outputs/apk/release/PIANO-${{ env.APK_VERSION }}.apk
          if-no-files-found: error
          retention-days: 90
